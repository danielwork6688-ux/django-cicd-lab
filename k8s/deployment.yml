apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}
  labels:
    app: ${APP_NAME}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ${APP_NAME}
  template:
    metadata:
      labels:
        app: ${APP_NAME}
    spec:
      containers:
        - name: ${APP_NAME}
          image: ${ACR_LOGIN_SERVER}/${APP_NAME}:${IMAGE_TAG}
          ports:
            - containerPort: 8000
          env:
            - name: SECRET_KEY
              value: "change-me-in-production"
            - name: DJANGO_SETTINGS_MODULE
              value: "config.settings"
            - name: ALLOWED_HOSTS
              value: "*"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
