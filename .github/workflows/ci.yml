name: CI

# ╔══════════════════════════════════════════════════════════════════════╗
# ║              SERVICE CONFIGURATION — edit these to reuse            ║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  Required GitHub Secrets (Settings → Secrets → Actions):           ║
# ║    ACR_LOGIN_SERVER      e.g. myregistry.azurecr.io                ║
# ║    AZURE_CLIENT_ID       Service principal client ID               ║
# ║    AZURE_CLIENT_SECRET   Service principal client secret           ║
# ║    AZURE_CREDENTIALS     Full JSON for azure/login                 ║
# ║    AZURE_SUBSCRIPTION_ID Azure subscription ID                     ║
# ╚══════════════════════════════════════════════════════════════════════╝
env:
  APP_NAME: django-cicd-lab
  PYTHON_VERSION: "3.12"
  FLAKE8_MAX_LINE_LENGTH: "120"
  AKS_RESOURCE_GROUP: daniel-cicd
  AKS_CLUSTER_NAME: django-cicd-aks
  K8S_NAMESPACE: default

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-test-scan:
    name: Lint + Test + Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit safety

      # ── Lint ────────────────────────────────────────────────────────────────
      - name: Lint (flake8)
        run: flake8 . --max-line-length=${{ env.FLAKE8_MAX_LINE_LENGTH }} --exclude=migrations

      # ── Test ────────────────────────────────────────────────────────────────
      - name: Test (Django)
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-secret-key-not-for-production
        run: python manage.py test --verbosity=2

      # ── Security Scan ───────────────────────────────────────────────────────
      - name: Security scan - code (bandit)
        run: bandit -r . --exclude ./.venv,./migrations -ll

      - name: Security scan - dependencies (safety)
        run: safety check -r requirements.txt

      # ── Build & Push Docker image to ACR ───────────────────────────────────
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push Docker image to ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.APP_NAME }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.APP_NAME }}:latest

      # ── Deploy to AKS ───────────────────────────────────────────────────────
      - name: Log in to Azure
        if: github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        if: github.ref == 'refs/heads/main'
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          subscription: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to AKS
        if: github.ref == 'refs/heads/main'
        env:
          APP_NAME: ${{ env.APP_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          envsubst < k8s/deployment.yml | kubectl apply -f - -n ${{ env.K8S_NAMESPACE }}
          envsubst < k8s/service.yml    | kubectl apply -f - -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/${{ env.APP_NAME }} -n ${{ env.K8S_NAMESPACE }}
