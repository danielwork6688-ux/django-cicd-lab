name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-test-scan:
    name: Lint + Test + Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit safety

      # ── Lint ────────────────────────────────────────────────────────────────
      - name: Lint (flake8)
        run: flake8 . --max-line-length=120 --exclude=migrations

      # ── Test ────────────────────────────────────────────────────────────────
      - name: Test (Django)
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-secret-key-not-for-production
        run: python manage.py test --verbosity=2

      # ── Security Scan ───────────────────────────────────────────────────────
      - name: Security scan - code (bandit)
        run: bandit -r . --exclude ./.venv,./migrations -ll

      - name: Security scan - dependencies (safety)
        run: safety check -r requirements.txt
